name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marche-rdc-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Force Min SDK to 24
      run: |
        if [ -f "variables.gradle" ]; then
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' variables.gradle
        fi
        if [ -f "app/build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' app/build.gradle
        fi

    - name: Build Android App Bundle (AAB)
      run: |
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: marche-rdc-app/app/build/outputs/bundle/release/app-release.aab
