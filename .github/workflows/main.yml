name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Nettoyer settings.gradle et préparer le build
      run: |
        echo "=== Recherche du dossier du projet Android ==="
        SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        if [ -z "$SETTINGS_PATH" ]; then
          echo "Erreur : settings.gradle introuvable !"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        echo "Dossier trouvé : $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        
        echo "=== Suppression des chemins personnalisés dans settings.gradle ==="
        if [ -f "settings.gradle" ]; then
          sed -i '/projectDir/d' settings.gradle
        fi
        if [ -f "settings.gradle.kts" ]; then
          sed -i '/projectDir/d' settings.gradle.kts
        fi

        echo "=== Modification de la version Min SDK à 24 ==="
        if [ -f "variables.gradle" ]; then
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' variables.gradle
        fi
        if [ -f "app/build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' app/build.gradle
        elif [ -f "build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' build.gradle
        fi

        echo "=== Lancement du build Gradle ==="
        gradle bundleRelease

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: '**/app/build/outputs/bundle/release/app-release.aab'
