name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Nettoyer settings.gradle
      run: |
        SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        if [ -n "$SETTINGS_PATH" ]; then
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_DIR"
          python3 -c "import os; [open(p, 'w', encoding='utf-8').write('\n'.join([l for l in open(p, encoding='utf-8').read().splitlines() if 'projectDir' not in l and 'settingsDir' not in l]) + '\n') for p in ['settings.gradle', 'settings.gradle.kts'] if os.path.exists(p)]"
        fi

    - name: Force Min SDK to 24
      run: |
        SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        cd "$PROJECT_DIR"
        if [ -f "variables.gradle" ]; then
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' variables.gradle
        fi
        if [ -f "app/build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' app/build.gradle
        elif [ -f "build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' build.gradle
        fi

    - name: Build Android App Bundle (AAB)
      run: |
        SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        cd "$PROJECT_DIR"
        gradle bundleRelease --no-daemon

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: '**/app/build/outputs/bundle/release/app-release.aab'
