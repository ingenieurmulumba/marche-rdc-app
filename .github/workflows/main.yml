name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix settings.gradle absolute paths
      run: |
        if [ -f "settings.gradle" ]; then
          sed -i '/project(\x27:app\x27)\.projectDir/d' settings.gradle
          sed -i '/project(":app").projectDir/d' settings.gradle
        fi
        if [ -f "settings.gradle.kts" ]; then
          sed -i '/project(":app").projectDir/d' settings.gradle.kts
        fi

    - name: Force Min SDK to 24
      run: |
        if [ -f "variables.gradle" ]; then
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' variables.gradle
        fi
        if [ -f "app/build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' app/build.gradle
        elif [ -f "build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' build.gradle
        fi

    - name: Build Android App Bundle (AAB)
      run: gradle bundleRelease

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: '**/app/build/outputs/bundle/release/app-release.aab'
