name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Install Capacitor CLI and Android
      run: npm install @capacitor/cli @capacitor/android

    - name: Build web assets
      run: npm run build

    - name: Initialize Android (Capacitor)
      run: |
        npx cap add android
        npx cap sync android

    - name: Force Min SDK to 24
      run: |
        if [ -f "android/variables.gradle" ]; then
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
        fi
        if [ -f "android/app/build.gradle" ]; then
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' android/app/build.gradle
        fi

    - name: Build Android App Bundle (AAB)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
